---
# INET 4031 Challenge Track 4: Machine Learning and AI
# This playbook extends the Weeks 1-4 baseline with the Track 4 MLflow role.
#
# Weeks 1-4 baseline infrastructure (from Solved Repositories/week-04/ansible/site.yml):
# Week 1: Baseline environment setup (inline tasks)
# Week 2: Deploy application stack (app-stack role)
# Week 3: Set up k3d cluster (k3d-setup role)
# Week 4: Install and initialize OpenTofu (opentofu-setup role)
# Track 4: Add MLflow and FastAPI for ML ops (mlflow role)
#
# By Week 14 Demo Day, this playbook should rebuild the entire environment from scratch.
#
# Usage:
#   Dry-run (check mode):
#     ansible-playbook -i inventory ansible/site.yml --check
#
#   Full deployment:
#     ansible-playbook -i inventory ansible/site.yml

- name: Baseline environment setup
  hosts: localhost
  connection: local
  become: yes

  tasks:
    - name: Update dnf cache
      dnf:
        update_cache: yes

    - name: Ensure baseline packages are installed
      dnf:
        name:
          - curl
          - git
          - vim
          - python3
          - python3-pip
        state: present

    - name: Ensure EPEL repository is enabled
      dnf:
        name: https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm
        state: present
        disable_gpg_check: yes

    - name: Ensure Ansible is installed
      dnf:
        name: ansible-core
        state: present

    - name: Import Docker CE GPG key
      ansible.builtin.rpm_key:
        key: https://download.docker.com/linux/rhel/gpg
        state: present

    - name: Add Docker CE repository
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/rhel/docker-ce.repo
        dest: /etc/yum.repos.d/docker-ce.repo
        mode: '0644'

    - name: Remove podman-docker (conflicts with docker-ce's docker binary)
      dnf:
        name:
          - podman-docker
          - podman
        state: absent

    - name: Ensure Docker is installed
      dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes

    - name: Add invoking user to the docker group
      ansible.builtin.user:
        name: "{{ lookup('env', 'SUDO_USER') or lookup('env', 'USER') }}"
        groups: docker
        append: yes

- name: Deploy application stack
  hosts: localhost
  connection: local
  become: yes

  roles:
    - app-stack

- name: Set up k3d cluster
  hosts: localhost
  connection: local
  become: yes

  roles:
    - k3d-setup

- name: Install and initialize OpenTofu
  hosts: localhost
  connection: local
  become: yes

  roles:
    - opentofu-setup

- name: Configure Machine Learning and AI Infrastructure (Challenge Track 4)
  hosts: localhost
  connection: local
  become: yes

  vars:
    mlflow_host: 0.0.0.0
    mlflow_port: 5001
    fastapi_host: 0.0.0.0
    fastapi_port: 8000

  roles:
    - mlflow

  # Verification tasks
  tasks:
    - name: Verify MLflow is running
      uri:
        url: http://localhost:5001/health
        method: GET
        status_code: 200
      retries: 5
      delay: 2
      register: mlflow_check
      tags:
        - verify

    - name: Verify FastAPI is running
      uri:
        url: http://localhost:8000/health
        method: GET
        status_code: 200
      retries: 5
      delay: 2
      register: fastapi_check
      tags:
        - verify

    - name: Display verification results
      debug:
        msg: |
          MLflow Status: {{ mlflow_check.status }}
          FastAPI Status: {{ fastapi_check.status }}
      tags:
        - verify
